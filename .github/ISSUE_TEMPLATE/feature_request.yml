name: 功能建议
description: 新平台适配、算法改进、UI/上位机增强或新技能包
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先讲场景与痛点，不要直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 可选；如果涉及 RTL，请说明对资源/时序/接口的影响
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 范围
      multiple: true
      options:
        - RTL / 算法
        - 新板卡 / 新 ADC
        - 屏上 UI
        - 上位机
        - 以太网
        - 技能包 / 文档
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 为什么不用更简单的办法
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我愿意提交 PR（不强制）
          required: false
        - label: 我理解本项目优先保证比赛基线的可复现性，新功能不能破坏 v74 签核口径
          required: true
