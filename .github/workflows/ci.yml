name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install host dependencies (headless subset)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pyserial>=3.5,<4" \
            "matplotlib>=3.9,<4" "Pillow>=11,<13"

      - name: Byte-compile Python sources
        run: python -m compileall -q host model tools

      - name: Host offline selftests (no GUI)
        run: |
          python host/regs.py --selftest
          python host/analysis.py --selftest
          python host/encoder.py --selftest

      - name: Static name check
        run: python tools/check_names.py

      - name: Relative link check
        run: python tools/check_links.py

      - name: Anonymity / path hygiene
        run: python tools/check_anonymity.py --strict-new

  cff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@v3
